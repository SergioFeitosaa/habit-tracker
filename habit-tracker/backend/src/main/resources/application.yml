spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/habit_tracker}
    username: ${DB_USER:habit_user}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
server:
  error:
    include-message: never
app:
  jwt-secret: ${JWT_SECRET}
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
  timezone: ${APP_TIMEZONE:America/Recife}
