name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Cancel obsolete runs for the same PR or branch, without affecting other runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21, PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: habit_tracker
          POSTGRES_USER: habit_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habit_user -d habit_tracker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      # Disposable credentials for the isolated CI database and application only.
      DB_URL: jdbc:postgresql://localhost:5432/habit_tracker
      DB_USER: habit_user
      DB_PASSWORD: ci-password
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      APP_TIMEZONE: America/Recife
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Set up Node.js for Java formatting
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Java formatting tools
        run: npm ci
      - name: Check Java formatting
        run: npm run format:check
      - name: Run unit and integration tests and package
        run: mvn --batch-mode --no-transfer-progress -DfailIfNoTests=true clean verify
      - name: Install frontend E2E dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run HTTP smoke and browser tests against PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(target/*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one packaged application jar."
            exit 1
          fi
          java -jar "${jars[0]}" > "$RUNNER_TEMP/backend.log" 2>&1 &
          app_pid=$!
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then cat "$RUNNER_TEMP/backend.log"; fi
            kill "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in {1..60}; do
            if curl --silent --output /dev/null http://localhost:8080/api/habits; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            echo "Backend did not start in time."
            exit 1
          fi
          python3 ../scripts/smoke_test.py
          (cd ../frontend && npm run test:e2e)
      - name: Export resolved Maven dependency tree
        run: mvn --batch-mode --no-transfer-progress org.apache.maven.plugins:maven-dependency-plugin:3.8.1:tree -DoutputType=json -DoutputFile=target/dependency-tree.json
      - name: Check Maven dependencies against GitHub advisories
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 ../scripts/audit_maven.py target/dependency-tree.json target/dependency-audit.md
      - name: Upload Maven dependency inventory and audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-dependency-audit
          path: |
            backend/target/dependency-tree.json
            backend/target/dependency-audit.md
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Check frontend formatting
        run: npm run format:check
      - name: Type-check and build
        run: npm run build
